!
!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname E1
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback3
 ip address 3.3.3.3 255.255.255.255
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex half
!
interface Serial1/0
 ip address 10.1.1.1 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 ip address 10.1.1.5 255.255.255.252
 serial restart-delay 0
!
interface Serial1/2
 ip address 128.107.1.1 255.255.255.0
 ip ospf 1 area 0
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 default-information originate always
!
router bgp 100
 no synchronization
 bgp log-neighbor-changes
 network 128.107.1.0 mask 255.255.255.0
 network 128.107.1.0 mask 255.255.255.252
 network 128.107.2.0 mask 255.255.255.0
 network 128.107.2.0 mask 255.255.255.252
 neighbor 1.1.1.1 remote-as 1
 neighbor 1.1.1.1 ebgp-multihop 3
 neighbor 1.1.1.1 update-source Loopback3
 neighbor 128.107.1.2 remote-as 100
 neighbor 128.107.1.2 next-hop-self
 neighbor 128.107.2.2 remote-as 100
 neighbor 128.107.2.2 next-hop-self
 no auto-summary
!
ip forward-protocol nd
ip route 1.1.1.1 255.255.255.255 10.1.1.6
ip route 1.1.1.1 255.255.255.255 10.1.1.2
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
