!
!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISP1
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback1
 ip address 1.1.1.1 255.255.255.255
!
interface Loopback20
 ip address 180.1.1.1 255.255.255.0
!
interface Loopback21
 ip address 180.2.2.1 255.255.255.0
!
interface Loopback22
 ip address 180.3.3.1 255.255.255.0
!
interface Loopback180
 ip address 180.0.0.1 255.255.255.0
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex half
!
interface Serial1/0
 ip address 10.1.1.2 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 ip address 10.1.1.6 255.255.255.252
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router bgp 1
 no synchronization
 bgp log-neighbor-changes
 network 1.1.1.1 mask 255.255.255.255
 redistribute connected
 neighbor 3.3.3.3 remote-as 100
 neighbor 3.3.3.3 ebgp-multihop 2
 neighbor 3.3.3.3 update-source Loopback1
 neighbor 3.3.3.3 route-map isp1 out
 maximum-paths 2
 no auto-summary
!
ip forward-protocol nd
ip route 3.3.3.3 255.255.255.255 10.1.1.5
ip route 3.3.3.3 255.255.255.255 10.1.1.1
no ip http server
no ip http secure-server
!
!
!
access-list 1 permit 1.1.1.1
access-list 1 permit 10.1.1.4 0.0.0.3
access-list 1 permit 10.1.1.0 0.0.0.3
no cdp log mismatch duplex
!
!
!
!
route-map isp1 deny 10
 match ip address 1
!
route-map isp1 permit 20
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
