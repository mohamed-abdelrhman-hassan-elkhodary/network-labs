!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 1.1.1.1 255.255.255.255
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf 1 area 0
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex half
!
interface Serial1/0
 ip address 10.1.1.5 255.255.255.252
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf 1 area 0
 serial restart-delay 0
!
interface Serial1/1
 ip address 10.1.1.1 255.255.255.252
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf 1 area 0
 serial restart-delay 0
!
interface Serial1/2
 ip address 17.9.1.2 255.255.255.252
 serial restart-delay 0
!
interface Serial1/3
 ip address 17.9.1.6 255.255.255.252
 serial restart-delay 0
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 default-information originate always
!
router bgp 500
 no synchronization
 bgp log-neighbor-changes
 network 150.1.0.0 mask 255.255.255.252
 neighbor 2.2.2.2 remote-as 500
 neighbor 2.2.2.2 description CONNECTION_TO_R2
 neighbor 2.2.2.2 update-source Loopback10
 neighbor 2.2.2.2 next-hop-self
 neighbor 3.3.3.3 remote-as 500
 neighbor 3.3.3.3 description CONNECTION_TO_R2
 neighbor 3.3.3.3 update-source Loopback10
 neighbor 3.3.3.3 next-hop-self
 neighbor 4.4.4.4 remote-as 500
 neighbor 4.4.4.4 description CONNECTION_TO_R2
 neighbor 4.4.4.4 update-source Loopback10
 neighbor 4.4.4.4 next-hop-self
 neighbor 11.11.11.11 remote-as 200
 neighbor 11.11.11.11 description CONNECTION_TO_ISP1
 neighbor 11.11.11.11 ebgp-multihop 2
 neighbor 11.11.11.11 update-source Loopback10
 neighbor 11.11.11.11 remove-private-as
 no auto-summary
!
ip forward-protocol nd
ip route 11.11.11.11 255.255.255.255 17.9.1.1
ip route 11.11.11.11 255.255.255.255 17.9.1.5
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
