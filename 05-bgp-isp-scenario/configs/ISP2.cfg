!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISP2
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback1
 ip address 200.1.1.1 255.255.255.0
!
interface Loopback2
 ip address 200.2.2.1 255.255.255.0
!
interface Loopback3
 ip address 200.3.3.1 255.255.255.0
!
interface Loopback10
 ip address 22.22.22.22 255.255.255.255
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex half
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 ip address 180.1.5.1 255.255.255.252
 serial restart-delay 0
!
interface Serial1/3
 ip address 180.1.5.5 255.255.255.252
 serial restart-delay 0
!
router bgp 300
 no synchronization
 bgp log-neighbor-changes
 redistribute connected route-map xx
 neighbor 2.2.2.2 remote-as 500
 neighbor 2.2.2.2 description CONNECTION_TO_R2
 neighbor 2.2.2.2 ebgp-multihop 2
 neighbor 2.2.2.2 update-source Loopback10
 no auto-summary
!
ip forward-protocol nd
ip route 2.2.2.2 255.255.255.255 180.1.5.6
ip route 2.2.2.2 255.255.255.255 180.1.5.2
no ip http server
no ip http secure-server
!
!
!
access-list 1 permit 200.1.1.0 0.0.0.255
access-list 1 permit 200.2.2.0 0.0.0.255
access-list 1 permit 200.3.3.0 0.0.0.255
no cdp log mismatch duplex
!
!
!
!
route-map xx permit 10
 match ip address 1
!
route-map xx deny 20
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
