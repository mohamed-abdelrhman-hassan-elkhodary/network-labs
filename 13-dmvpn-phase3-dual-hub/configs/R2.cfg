!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr 3des
 hash md5
 authentication pre-share
 group 2
crypto isakmp key cisco123 address 0.0.0.0 0.0.0.0
!
!
crypto ipsec transform-set ABC esp-3des esp-sha-hmac 
 mode transport
!
crypto ipsec profile IPROF
 set transform-set ABC 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 4.4.4.4 255.255.255.255
!
interface Tunnel0
 ip address 10.0.0.4 255.255.255.0
 no ip redirects
 ip nhrp map 10.0.0.1 15.0.0.1
 ip nhrp map 10.0.0.2 25.0.0.2
 ip nhrp map multicast 15.0.0.1
 ip nhrp map multicast 25.0.0.2
 ip nhrp network-id 1234
 ip nhrp nhs 10.0.0.1
 ip nhrp nhs 10.0.0.2
 ip nhrp shortcut
 tunnel source Serial1/0
 tunnel mode gre multipoint
 tunnel protection ipsec profile IPROF
!
interface FastEthernet0/0
 ip address 192.168.4.1 255.255.255.0
 duplex half
!
interface Serial1/0
 ip address 45.0.0.4 255.0.0.0
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router eigrp 100
 network 4.0.0.0
 network 10.0.0.0
 network 192.168.4.0
 auto-summary
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 Serial1/0
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
